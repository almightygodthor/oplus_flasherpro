name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner files
        run: flutter create --platforms=windows --project-name flasherpro .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows application
        run: flutter build windows --release

      - name: Download Android Platform Tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "$env:RUNNER_TEMP\platform-tools.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\platform-tools.zip" -DestinationPath "$env:RUNNER_TEMP\platform-tools-extracted" -Force
          $releaseDir = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path "$releaseDir\platform-tools" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\platform-tools-extracted\platform-tools\*" "$releaseDir\platform-tools" -Recurse -Force

      - name: Bundle payload-dumper-go
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "$env:RUNNER_TEMP\payload-dumper-go.tar.gz"
          $extractDir = "$env:RUNNER_TEMP\payload-dumper-go"
          Invoke-WebRequest -Uri "https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_windows_amd64.tar.gz" -OutFile $archive
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          tar -xzf $archive -C $extractDir
          $dumper = Get-ChildItem -Path $extractDir -Recurse -Filter "payload-dumper-go.exe" | Select-Object -First 1
          if ($null -eq $dumper) { throw "payload-dumper-go.exe was not found in the official release archive." }
          $releaseDir = "build\windows\x64\runner\Release"
          Copy-Item $dumper.FullName "$releaseDir\payload-dumper-go.exe" -Force
          $xzArchive = "$env:RUNNER_TEMP\xz-windows.zip"
          $xzExtract = "$env:RUNNER_TEMP\xz-windows"
          Invoke-WebRequest -Uri "https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4-windows.zip" -OutFile $xzArchive
          New-Item -ItemType Directory -Force -Path $xzExtract | Out-Null
          Expand-Archive -Path $xzArchive -DestinationPath $xzExtract -Force
          $xz = Get-ChildItem -Path $xzExtract -Recurse -Filter "xz.exe" | Where-Object { $_.FullName -match "x86-64|x86_64|x64" } | Select-Object -First 1
          if ($null -eq $xz) { $xz = Get-ChildItem -Path $xzExtract -Recurse -Filter "xz.exe" | Select-Object -First 1 }
          if ($null -eq $xz) { throw "xz.exe was not found in the official XZ Utils release archive." }
          Copy-Item $xz.FullName "$releaseDir\xz.exe" -Force
          $xzLicense = Get-ChildItem -Path $xzExtract -Recurse -File | Where-Object { $_.Name -match "COPYING|LICENSE" } | Select-Object -First 1
          if ($null -ne $xzLicense) { Copy-Item $xzLicense.FullName "$releaseDir\XZ-Utils-LICENSE.txt" -Force }

      - name: Prepare bundled application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "build\windows\x64\runner\Release"
          if (Test-Path "$releaseDir\flasherpro.exe") {
            Rename-Item "$releaseDir\flasherpro.exe" "FlasherPro.exe"
          }
          if (!(Test-Path "$releaseDir\platform-tools\fastboot.exe")) {
            throw "Bundled fastboot.exe was not found in the release directory."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "installer\FlasherPro.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlasherPro-Setup-x64
          path: installer/FlasherPro-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/FlasherPro-Setup-x64.exe
          generate_release_notes: true
